# Weekly check that every external link (IOK, Fost Plus, YouTube, ...) still works.
# Not part of the PR checks: other people's websites shouldn't block our merges.
# GitHub emails the person who last edited this schedule when the run fails.
name: Check links

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read # read the repository, nothing else

jobs:
  links:
    name: external links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Check external links
        run: uv run --locked pytest -m external
