# Monthly, grouped update PRs for pinned GitHub Actions and Python dependencies.
# Each PR runs the full build/test pipeline; merge when green.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7 # skip releases younger than a week (supply-chain safety)
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
